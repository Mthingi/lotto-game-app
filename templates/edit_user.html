<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>MPG Edit User</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #1b5e20;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .edit-container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-row input,
        .form-row select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-row input[readonly] {
            background: #eeeeee;
            color: #666;
        }

        .button-row {
            margin-top: 25px;
        }

        .save-button {
            background: #1b5e20;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 10px;
        }

        .cancel-button {
            background: #e0e0e0;
            color: #222;
            padding: 11px 20px;
            text-decoration: none;
            display: inline-block;
            font-size: 15px;
        }

        .protected-note {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            margin-bottom: 25px;
        }

    </style>

</head>

<body>

<h1>👤 EDIT MPG USER</h1>

<p class="subtitle">
    Owner Administration — Update User Details
</p>

{% include '_navigation.html' %}

<div class="edit-container">

    <div class="protected-note">

        <strong>Username:</strong>

        The username cannot be changed after the account has been created.

    </div>

    <form
        method="POST"
        action="{{ url_for('edit_user', username=username) }}"
    >

        <div class="form-row">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                value="{{ username }}"
                readonly
            >

        </div>

        <div class="form-row">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ name }}"
                required
            >

        </div>

        <div class="form-row">

            <label for="role">
                Department / Role
            </label>

            <select
                id="role"
                name="role"
                required
            >

                <option
                    value="RESULTS"
                    {% if role == "RESULTS" %}selected{% endif %}
                >
                    Results
                </option>

                <option
                    value="FINANCE"
                    {% if role == "FINANCE" %}selected{% endif %}
                >
                    Finance
                </option>

                <option
                    value="SUPPORT"
                    {% if role == "SUPPORT" %}selected{% endif %}
                >
                    Customer Support
                </option>

                <option
                    value="SMS"
                    {% if role == "SMS" %}selected{% endif %}
                >
                    SMS Operations
                </option>

            </select>

        </div>

        <div class="button-row">

            <button
                type="submit"
                class="save-button"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('user_management') }}"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
