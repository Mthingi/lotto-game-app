<!DOCTYPE html>
<html>

<head>

    <title>MPG Two-Factor Authentication</title>

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial;
        }

        .login-box{

            width:400px;

            margin:100px auto;

            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0 0 10px #ccc;

        }

        h2{

            text-align:center;

            color:green;

        }

        p{

            text-align:center;

            color:#555;

        }

        input{

            width:100%;

            padding:12px;

            margin-top:20px;

            box-sizing:border-box;

            font-size:20px;

            text-align:center;

            letter-spacing:5px;

        }

        button{

            width:100%;

            padding:12px;

            margin-top:20px;

            background:green;

            color:white;

            border:none;

            cursor:pointer;

            font-size:16px;

        }

        button:hover{

            background:#006400;

        }

        .error{

            margin-top:15px;

            padding:10px;

            background:#f8d7da;

            color:#721c24;

            border:1px solid #f5c6cb;

            border-radius:5px;

            text-align:center;

        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>MPG ADMIN</h2>

    <p>
        Enter the 6-digit code from your authenticator app.
    </p>

    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="6-digit code"
            required
        >

        <button type="submit">
            Verify & Continue
        </button>

    </form>

</div>

</body>

</html>
